# Model lesson. Copy the structure; replace every value.
id: l00
title: Asking a Better Question
summary: >
  The same task, three prompts, three very different answers. Learning to
  predict what a prompt will get wrong before you send it.
duration_min: 60
tier: judgment
thinking_skills:
  - critical-evaluation
  - intentional-direction
video:
  - label: Class recording
    url: https://youtu.be/REPLACE
prerequisites: [l01]
tags: [prompting, evaluation]

outcomes:                        # student-facing; what they can do afterwards
  - name what a prompt will get wrong before you send it
  - improve a prompt by adding what the tool can't know, not by being politer
  - rank two answers against a standard you wrote down first, and say why
project:
  name: Prompt Log
  brief: >
    Three rounds on one task, each prediction written before the send, and a
    three-line standard the outputs get ranked against.
  starter: assets/prompt-log-study-plan.md
resources:
  - label: Anthropic — prompt engineering overview
    url: https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview
    note: skim the headings; you are looking for the shape, not the detail
